<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Manager</title>
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#1f2430;--mute:#6b7280;--line:#e3e0d8;--accent:#0f766e;--danger:#c2410c}
*{box-sizing:border-box;margin:0}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:40px 16px}
main{max-width:620px;margin:0 auto}
h1{font-size:2rem;letter-spacing:-.02em}
.sub{color:var(--mute);margin:4px 0 22px}
.add{display:flex;gap:8px}
input[type=text],select{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
#text{flex:1;min-width:0}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 18px;background:var(--accent);color:#fff;font-weight:600}
button.sm{padding:6px 10px;background:none;color:var(--mute);border:1px solid var(--line);font-weight:500;font-size:.85rem}
button.sm:hover{color:var(--ink);border-color:var(--ink)}
button.sm.del:hover{color:var(--danger);border-color:var(--danger)}
:focus-visible{outline:3px solid #14b8a6;outline-offset:2px}
.err{color:var(--danger);font-size:.88rem;min-height:1.2em;margin:6px 2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 14px}
.filters{display:flex;gap:6px}
.filters button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:7px 14px;font-weight:500}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
ul{list-style:none;padding:0;display:grid;gap:10px}
li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
li input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
li .t{flex:1;min-width:0;overflow-wrap:anywhere}
li.done .t{text-decoration:line-through;color:var(--mute)}
li .edit{flex:1;min-width:0;padding:6px 10px}
.empty{text-align:center;color:var(--mute);padding:34px 0}
.foot{display:flex;justify-content:space-between;margin-top:16px;color:var(--mute);font-size:.9rem}
.foot button{background:none;color:var(--danger);padding:0;font-weight:500;border-radius:4px}
@media(max-width:480px){.add{flex-direction:column}}
</style>
</head>
<body>
<main>
 <h1>Task Manager</h1>
 <p class="sub">Add tasks, tick them off, and they stay saved in this browser.</p>
 <div class="add">
  <input type="text" id="text" placeholder="What needs doing?" maxlength="120" aria-label="New task">
  <select id="pri" aria-label="Priority"><option>Normal</option><option>High</option><option>Low</option></select>
  <button id="addBtn">Add task</button>
 </div>
 <div class="err" id="err" role="alert"></div>
 <div class="bar">
  <div class="filters" id="filters">
   <button data-f="all" class="on">All</button><button data-f="active">Active</button><button data-f="done">Completed</button>
  </div>
 </div>
 <ul id="list"></ul>
 <div class="foot"><span id="count"></span><button id="clear">Clear completed</button></div>
</main>
<script>
let tasks=[],filter='all',editing=null;
try{tasks=JSON.parse(localStorage.getItem('tasks'))||[]}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem('tasks',JSON.stringify(tasks))}catch(e){}};

function add(){
  const v=$('text').value.trim();
  if(!v){$('err').textContent='Type a task before adding it.';return}
  $('err').textContent='';
  tasks.unshift({id:Date.now(),text:v,pri:$('pri').value,done:false});
  $('text').value='';save();render();
}
function render(){
  const shown=tasks.filter(t=>filter==='all'||(filter==='done')===t.done);
  const ul=$('list');ul.innerHTML='';
  if(!shown.length){ul.innerHTML='<div class="empty">'+(tasks.length?'No tasks in this view.':'No tasks yet. Add your first one above.')+'</div>'}
  shown.forEach(t=>{
    const li=document.createElement('li');if(t.done)li.className='done';
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;cb.setAttribute('aria-label','Mark done');
    cb.onchange=()=>{t.done=cb.checked;save();render()};
    li.append(cb);
    if(editing===t.id){
      const inp=document.createElement('input');inp.type='text';inp.className='edit';inp.value=t.text;
      const ok=btn('Save','',()=>{const v=inp.value.trim();if(v){t.text=v;editing=null;save();render()}});
      inp.onkeydown=e=>{if(e.key==='Enter')ok.click();if(e.key==='Escape'){editing=null;render()}};
      li.append(inp,ok,btn('Cancel','',()=>{editing=null;render()}));
      setTimeout(()=>inp.focus());
    }else{
      const s=document.createElement('span');s.className='t';s.textContent=t.text;
      const p=document.createElement('span');p.textContent=t.pri;p.style.cssText='font-size:.78rem;color:'+(t.pri==='High'?'var(--danger)':'var(--mute)');
      li.append(s,p,btn('Edit','',()=>{editing=t.id;render()}),btn('Delete','del',()=>{tasks=tasks.filter(x=>x.id!==t.id);save();render()}));
    }
    ul.append(li);
  });
  const left=tasks.filter(t=>!t.done).length;
  $('count').textContent=left+(left===1?' task left':' tasks left');
}
function btn(label,cls,fn){const b=document.createElement('button');b.className='sm '+cls;b.textContent=label;b.onclick=fn;return b}
$('addBtn').onclick=add;
$('text').onkeydown=e=>{if(e.key==='Enter')add()};
$('filters').onclick=e=>{const f=e.target.dataset.f;if(!f)return;filter=f;
  document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('on',b.dataset.f===f));render()};
$('clear').onclick=()=>{tasks=tasks.filter(t=>!t.done);save();render()};
render();
</script>
</body>
</html>
